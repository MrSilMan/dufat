name: dufat

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dufat
      POSTGRES_PASSWORD: dufat
      POSTGRES_DB: dufat
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dufat -d dufat"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs migrations + seed once, then exits. The app waits for it.
  migrate:
    build:
      context: .
      target: builder
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    environment:
      DATABASE_URL: postgresql://dufat:dufat@postgres:5432/dufat?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@dufat.co.ao}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-dufat-admin-2026}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://dufat:dufat@postgres:5432/dufat?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-string}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - app-logs:/app/logs
      - app-uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
  app-logs:
  app-uploads:
